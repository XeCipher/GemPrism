<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- A more accurate glow effect that matches your image -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Gradient for the prism's body, from dark green to a darker tone -->
        <linearGradient id="prismFillGrad" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#032D21" stop-opacity="0.8" />
        </linearGradient>

        <!-- The TRUE gradient for the outgoing light rays (green to cyan) -->
        <linearGradient id="lineStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6ee7b7" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
    </defs>

    <!-- 1. The incoming white line -->
    <line 
        x1="6" y1="50" x2="22" y2="50"
        stroke="white" stroke-width="2.5" stroke-linecap="round"
    />

    <!-- 2. The prism with a brighter outline and new gradient fill -->
    <polygon 
        points="22,50 73,16 73,84"
        fill="url(#prismFillGrad)"
        stroke="#6ee7b7" stroke-width="2" stroke-linejoin="round"
    />

    <!-- 3. The outgoing lines, now all using the correct gradient stroke -->
    <g filter="url(#glow)">
        <line x1="73" y1="24" x2="94" y2="7"  stroke="url(#lineStrokeGrad)" stroke-width="1.6" stroke-linecap="round" />
        <line x1="73" y1="33" x2="94" y2="21" stroke="url(#lineStrokeGrad)" stroke-width="1.8" stroke-linecap="round" />
        <line x1="73" y1="41" x2="94" y2="37" stroke="url(#lineStrokeGrad)" stroke-width="2.0" stroke-linecap="round" />
        <line x1="73" y1="50" x2="94" y2="53" stroke="url(#lineStrokeGrad)" stroke-width="2.4" stroke-linecap="round" />
        <line x1="73" y1="58" x2="94" y2="68" stroke="url(#lineStrokeGrad)" stroke-width="2.0" stroke-linecap="round" />
        <line x1="73" y1="67" x2="94" y2="82" stroke="url(#lineStrokeGrad)" stroke-width="1.8" stroke-linecap="round" />
        <line x1="73" y1="76" x2="94" y2="96" stroke="url(#lineStrokeGrad)" stroke-width="1.6" stroke-linecap="round" />
    </g>
</svg>